<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="프론트엔드 개발자 홍길동의 프로필 및 포트폴리오" />
  <title>홍길동 | 프론트엔드 개발자</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 포인트 컬러(brand)를 한곳에서 바꿀 수 있도록 설정
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-200 antialiased font-sans">
  <!-- 배경 글로우 -->
  <div class="glow" aria-hidden="true"></div>

  <!-- 고정 헤더 + 네비게이션 -->
  <header id="site-header" class="fixed inset-x-0 top-0 z-50 transition-colors duration-300">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-5 sm:px-6">
      <a href="#home" class="text-2xl font-bold tracking-tight text-white">
        홍길동<span class="text-brand-400">.</span>
      </a>

      <!-- 데스크톱 메뉴 -->
      <nav aria-label="주요 메뉴" class="hidden md:block">
        <ul class="flex items-center gap-10 text-base text-slate-300 lg:text-lg">
          <li><a href="#about" class="nav-link">소개</a></li>
          <li><a href="#skills" class="nav-link">기술</a></li>
          <li><a href="#projects" class="nav-link">프로젝트</a></li>
          <li><a href="#contact" class="nav-link">연락처</a></li>
        </ul>
      </nav>

      <!-- 모바일 햄버거 버튼 -->
      <button
        id="menu-toggle"
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-800 text-slate-300 transition hover:border-brand-400 hover:text-white md:hidden"
        aria-label="메뉴 열기"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- 모바일 메뉴 -->
    <nav id="mobile-menu" aria-label="모바일 메뉴" class="hidden border-t border-slate-800 bg-slate-950/95 backdrop-blur md:hidden">
      <ul class="flex flex-col px-4 py-3 text-slate-300">
        <li><a href="#about" class="mobile-link">소개</a></li>
        <li><a href="#skills" class="mobile-link">기술</a></li>
        <li><a href="#projects" class="mobile-link">프로젝트</a></li>
        <li><a href="#contact" class="mobile-link">연락처</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- 히어로 -->
    <section id="home" class="hero-bg relative flex min-h-screen items-center px-4 pt-24 sm:px-6">
      <div class="mx-auto grid w-full max-w-6xl items-center gap-12 md:grid-cols-[1fr_auto]">
        <div class="reveal">
          <p class="mb-4 inline-flex items-center gap-2 rounded-full border border-brand-500/30 bg-brand-500/10 px-3 py-1 text-sm text-brand-300">
            <span class="h-2 w-2 animate-pulse rounded-full bg-brand-400"></span>
            <span data-bind="role">프론트엔드 개발자</span>
          </p>
          <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-6xl">
            안녕하세요, <span class="text-brand-400" data-bind="name">홍길동</span>입니다
          </h1>
          <p class="mt-6 max-w-xl text-lg leading-relaxed text-slate-400" data-bind="intro">
            사용자가 편하게 쓸 수 있는 웹 경험을 만드는 것을 좋아합니다.
          </p>
          <div class="mt-10 flex flex-wrap gap-4">
            <a href="#projects" class="rounded-lg bg-brand-500 px-6 py-3 font-semibold text-white shadow-lg shadow-brand-500/20 transition hover:bg-brand-600">
              프로젝트 보기
            </a>
            <a href="#contact" class="rounded-lg border border-slate-700 px-6 py-3 font-semibold text-slate-200 transition hover:border-brand-400 hover:text-brand-300">
              연락하기
            </a>
          </div>
        </div>

        <!-- 아바타 자리 (이니셜) -->
        <div class="reveal mx-auto hidden md:block">
          <img
            src="assets/profile.svg"
            alt="홍길동 프로필 사진 (임시 이미지)"
            width="224"
            height="224"
            class="h-56 w-56 rounded-3xl border border-slate-800 object-cover shadow-2xl shadow-brand-500/10"
          />
        </div>
      </div>
    </section>

    <!-- 소개 -->
    <section id="about" class="px-4 py-24 sm:px-6">
      <div class="reveal mx-auto max-w-3xl">
        <h2 class="section-title">소개</h2>
        <div id="about-text" class="mt-8 space-y-4 text-lg leading-relaxed text-slate-400"></div>
      </div>
    </section>

    <!-- 기술 스택 -->
    <section id="skills" class="px-4 py-24 sm:px-6">
      <div class="reveal mx-auto max-w-6xl">
        <h2 class="section-title">기술 스택</h2>
        <ul id="skills-list" class="mt-8 flex flex-wrap gap-3"></ul>
      </div>
    </section>

    <!-- 프로젝트 -->
    <section id="projects" class="px-4 py-24 sm:px-6">
      <div class="reveal mx-auto max-w-6xl">
        <h2 class="section-title">프로젝트</h2>
        <div id="projects-list" class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>

    <!-- 연락처 -->
    <section id="contact" class="px-4 py-24 sm:px-6">
      <div class="reveal mx-auto max-w-3xl rounded-3xl border border-slate-800 bg-slate-900/50 p-8 text-center backdrop-blur sm:p-12">
        <h2 class="text-3xl font-bold text-white">함께 이야기해요</h2>
        <p class="mt-4 text-slate-400">새로운 프로젝트나 협업 제안은 언제든 환영합니다.</p>

        <div class="mt-8 flex flex-col items-center justify-center gap-4 sm:flex-row">
          <a id="email-link" href="#" class="rounded-lg bg-brand-500 px-6 py-3 font-semibold text-white transition hover:bg-brand-600">
            이메일 보내기
          </a>
          <button id="copy-email" type="button" class="rounded-lg border border-slate-700 px-6 py-3 font-semibold text-slate-200 transition hover:border-brand-400 hover:text-brand-300">
            이메일 복사
          </button>
          <a id="github-link" href="#" target="_blank" rel="noopener noreferrer" class="rounded-lg border border-slate-700 px-6 py-3 font-semibold text-slate-200 transition hover:border-brand-400 hover:text-brand-300">
            GitHub
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-800 px-4 py-8 text-center text-sm text-slate-500">
    © <span id="year"></span> 홍길동. Built with HTML, CSS, JavaScript &amp; Tailwind CSS.
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
